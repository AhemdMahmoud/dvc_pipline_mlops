name: dvc-pipe
on: [push]
permissions: write-all
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: '16'
      - uses: iterative/setup-dvc@v1
        with:
          version: '2.45.1'  # Specify the DVC version
      - uses: iterative/setup-cml@v1
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Changed from 3.x to 3.10
      
      - name: Env
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel setuptools numpy scipy cython
          python -m pip install -r requirements.txt
          
      - name: Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create required directories
          mkdir -p outs_data cml_plots
          
          # Ensure params.yaml exists
          [ -f params.yaml ] || {
            echo "Creating default params.yaml"
            echo "data_version: \"v1\"" > params.yaml
            echo "model:" >> params.yaml
            echo "  random_state: 42" >> params.yaml
            echo "  test_size: 0.2" >> params.yaml
          }
          
          # Initialize DVC pipeline
          dvc init --no-scm || true
          
          # Run DVC pipeline with error handling
          dvc repro || {
            echo "DVC pipeline failed, check parameters and data"
            exit 1
          }
          
          # Generate report with metrics and plots
          echo "## Model Metrics" > report.md
          
          # Add model metrics comparison
          echo "### Training Metrics" >> report.md
          dvc metrics show --md >> report.md
          
          echo "### Metrics Comparison with Main Branch" >> report.md
          dvc metrics diff main --md >> report.md
          
          # Add visualizations
          echo "## Model Performance Visualizations" >> report.md
          
          # Add confusion matrix
          echo "### Confusion Matrix" >> report.md
          if [ -f conf_matrix.png ]; then
            cp conf_matrix.png ./cml_plots/confusion_matrix.png
            echo "![Confusion Matrix](./cml_plots/confusion_matrix.png)" >> report.md
          fi
          
          # Add any additional plots (if available)
          if [ -f roc_curve.png ]; then
            cp roc_curve.png ./cml_plots/roc_curve.png
            echo "### ROC Curve" >> report.md
            echo "![ROC Curve](./cml_plots/roc_curve.png)" >> report.md
          fi
          
          # Add training history plot (if available)
          if [ -f training_history.png ]; then
            cp training_history.png ./cml_plots/training_history.png
            echo "### Training History" >> report.md
            echo "![Training History](./cml_plots/training_history.png)" >> report.md
          fi
          
          # Post report as comment
          cml comment create report.md