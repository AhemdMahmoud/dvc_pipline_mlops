name: dvc-pipe

on: [push]

permissions: write-all

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '16'

      - uses: iterative/setup-dvc@v1

      - uses: iterative/setup-cml@v1

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies for SciPy
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libatlas-base-dev gfortran

      - name: Env
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Untrack data file if needed
        run: |
          if git ls-files --error-unmatch outs_data/prepared_data.csv > /dev/null 2>&1; then
            git rm --cached outs_data/prepared_data.csv
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            echo "outs_data/prepared_data.csv" >> .gitignore
            git add .gitignore
            git commit -m "CI: Remove prepared_data.csv from Git tracking"
            git push
          else
            echo "prepared_data.csv is not tracked by Git. Skipping untracking step."
          fi

      - name: Run DVC pipeline and post report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dvc repro
          git fetch --prune

          echo "## Metrics" >> report.md
          dvc metrics diff --md main >> report.md

          echo "## Confusion Matrix" >> report.md
          echo "![](./conf_matrix.png)" >> report.md

          cml comment create report.md
