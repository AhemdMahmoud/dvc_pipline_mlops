name: churn-imbalanced-dvc-pipeline
on: [push]
permissions: write-all # Required for posting comments and reports

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # Changed to a specific version for better compatibility

      - name: Install CML
        uses: iterative/setup-cml@v1

      - name: Install Dependencies
        run: |
          # Upgrade pip
          python -m pip install --upgrade pip
          # Install numpy first to ensure compatibility with scikit-learn
          pip install "numpy>=1.17.3,<1.24.0"
          # Install other dependencies
          pip install -r requirements.txt
        env:
          CXX: g++ # Ensures correct C++ compiler is used for sklearn and Cython compilation issues

      - name: Verify Installed Packages
        run: |
          # Print installed packages for debugging
          pip list

      - name: Remove Files from Git Tracking
        if: "runner.os == 'Linux'"
        run: |
          # Configure Git identity
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # List of files to untrack from Git
          FILES_TO_UNTRACK=(
            "outs_data/prepared_data.csv"
            "outs_data/X_train_final.csv"
            "outs_data/X_test_final.csv"
            "outs_data/y_train_final.csv"
            "outs_data/y_test_final.csv"
          )
          
          # Remove files from Git tracking
          for file in "${FILES_TO_UNTRACK[@]}"; do
            if [ -f "$file" ]; then
              git rm -r --cached "$file" || true
            fi
          done
          
          # Commit changes if there are any
          git diff --staged --quiet || git commit -m "Stop tracking DVC-managed files"

      - name: Generate and Post Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run DVC pipeline
          dvc repro
          git fetch --prune

          # Generate the report
          echo "## Metrics" > report.md
          dvc metrics diff --md >> report.md

          # Append confusion matrix to the report
          echo "## Confusion Matrix" >> report.md
          echo "![](./conf_matrix.png)" >> report.md

          # Post the report as a comment
          cml comment create --token ${{ secrets.GITHUB_TOKEN }} report.md