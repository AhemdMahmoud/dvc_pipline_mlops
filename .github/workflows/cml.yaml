name: dvc-pipe
on: [push]
permissions: write-all
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: '16'
      - uses: iterative/setup-dvc@v1
        with:
          version: '2.45.1'  # Specify the DVC version
      - uses: iterative/setup-cml@v1
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Changed from 3.x to 3.10
      
      - name: Env
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel setuptools numpy scipy cython
          python -m pip install -r requirements.txt
          
      - name: Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure DVC is properly configured
          dvc pull
          
          # Post reports as comments in GitHub PRs
          dvc repro
          git fetch --prune

          echo "## Metrics" >> report.md
          dvc metrics diff --md main >> report.md

          echo "## Confusion Matrix" >> report.md
          echo "![](./conf_matrix.png)" >> report.md
          
          cml comment create report.md